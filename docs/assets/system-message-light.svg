<svg xmlns="http://www.w3.org/2000/svg" width="451" height="256" viewBox="0 0 451 256" role="img" aria-labelledby="t d">
<title id="t">System message</title>
<desc id="d">Trust is not a verification method. Confidence is not evidence. A passing test is evidence within its coverage. Verify the work. Document the evidence. Own the result.</desc>
<style>text{fill:#1f2328;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;font-size:14px;white-space:pre}</style>
<text x="149.8" y="33" xml:space="preserve" textLength="151.2" lengthAdjust="spacing">[ SYSTEM MESSAGE ]</text>
<text x="78.4" y="73" xml:space="preserve" textLength="294.0" lengthAdjust="spacing">TRUST IS NOT A VERIFICATION METHOD.</text>
<text x="112.0" y="93" xml:space="preserve" textLength="226.8" lengthAdjust="spacing">CONFIDENCE IS NOT EVIDENCE.</text>
<text x="28.0" y="113" xml:space="preserve" textLength="394.8" lengthAdjust="spacing">A PASSING TEST IS EVIDENCE WITHIN ITS COVERAGE.</text>
<text x="158.2" y="153" xml:space="preserve" textLength="134.4" lengthAdjust="spacing">VERIFY THE WORK.</text>
<text x="133.0" y="173" xml:space="preserve" textLength="184.8" lengthAdjust="spacing">DOCUMENT THE EVIDENCE.</text>
<text x="162.4" y="193" xml:space="preserve" textLength="126.0" lengthAdjust="spacing">OWN THE RESULT.</text>
<text x="141.4" y="233" xml:space="preserve" textLength="168.0" lengthAdjust="spacing">[ END TRANSMISSION ]</text>
</svg>
