name: Link check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        env:
          # Authenticated GitHub requests avoid rate-limit 503s on github.com links.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Some standards bodies (ISO, AICPA, PCI SSC) block automated
          # checkers with 403/429; treat those as reachable rather than broken.
          # ftc.gov answers GitHub-hosted runners with 404 and peoplecert.org with
          # 500 even though the pages load in a browser, so they are excluded.
          # Re-check those links by hand when editing them.
          # The vendored upstream snapshots are not ours to fix and are excluded.
          args: >-
            --no-progress
            --max-concurrency 4
            --max-retries 3
            --accept '100..=103,200..=299,403,429'
            --exclude '^https://www\.ftc\.gov/'
            --exclude '^https://www\.peoplecert\.org/'
            --exclude-path vendor
            '**/*.md'
          fail: true
